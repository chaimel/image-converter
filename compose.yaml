services:
    converter:
        build: .
        image: image-converter
        restart: unless-stopped
        ports:
            # Reachable only from this machine. On a server, nginx or Caddy forwards your domain here.
            - '127.0.0.1:3000:3000'
        environment:
            # ENV comes from the root .env and loads environments/<ENV>.env (docker if not set).
            ENV: ${ENV:-docker}
        # At most 1 GB of RAM. Swap is capped at the same value so images are never swapped to disk.
        # If the limit is hit, Docker stops the container and restart: unless-stopped starts it again.
        mem_limit: 1g
        memswap_limit: 1g
        # Nothing is written to disk: the app is read-only and /tmp lives in memory.
        read_only: true
        tmpfs:
            - /tmp
        cap_drop:
            - ALL
        security_opt:
            - no-new-privileges:true
